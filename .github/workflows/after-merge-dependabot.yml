name: after-merge-dependabot

on:
  pull_request_target:
    types: [closed]

jobs:
  check:
    if: github.event.pull_request.merged && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: dependabot-after-merge
      cancel-in-progress: true
    steps:
      - name: Fetch dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - uses: oprypin/find-latest-tag@v1.1.3
        id: octokit
        with:
          repository: ${{ github.repository }}
          prefix: v

      - name: Compute tag
        id: compute_tag
        env:
          LAST_TAG: ${{ steps.octokit.outputs.tag }}
          UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
        run: |
          IFS=. read -r major minor patch <<< "${LAST_TAG#v}"
          if [ "$UPDATE_TYPE" == "version-update:semver-minor" ]; then
            minor=$((minor+1))
            patch=0
            echo "::warning::bumping minor version"
          elif [ "$UPDATE_TYPE" == "version-update:semver-patch" ]; then
            patch=$((patch+1))
            echo "::warning::bumping patch version"
          fi
          tag="v${major}.${minor}.${patch}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "::warning::tag == ${tag}"

      # AUTO_MERGE_TOKEN rather than GITHUB_TOKEN so the new tag triggers downstream workflows
      - name: Create tag
        if: steps.compute_tag.outputs.tag != steps.octokit.outputs.tag
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          TAG: ${{ steps.compute_tag.outputs.tag }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
